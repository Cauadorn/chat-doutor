<html lang="pt-BR">
<head>

<meta name="description" content="Protótipo funcional do Chat Doutor: app do paciente e app do médico ligados.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Protótipo Chat Doutor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@600;700&display=swap">
<style>
/* Layout: dois celulares lado a lado (paciente e médico, ligados) + painel de teste. No celular: um aparelho por vez. */
:root {
  --deep:#063B4E; --teal:#0E8C8B; --teal7:#0C7574; --green:#2BC9A0; --green7:#1C8469; --aqua:#DCF0EC; --aqua50:#EEF7F7;
  --mint:#DDF6F0; --graphite:#0B1A1F; --coral:#FF8A6B; --coral7:#9F5643; --coral50:#FFEAE4; --red:#D44029;
  --g700:#4E595D; --g500:#6D7679; --g200:#EBEFF1; --g50:#F6F8F9; --white:#FFFFFF;
  --page-bg:#DFE8E9; --page-fg:#0B1A1F; --page-muted:#4E595D; --panel:#FFFFFF; --line:#CFDADC;
  --f-display:'Sora', 'Segoe UI', system-ui, sans-serif; --f-body:'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page-bg:#06171D; --page-fg:#E4EEEF; --page-muted:#9DB2B5; --panel:#0B2830; --line:#1D3E47; color-scheme: dark } }
:root[data-theme="dark"] { --page-bg:#06171D; --page-fg:#E4EEEF; --page-muted:#9DB2B5; --panel:#0B2830; --line:#1D3E47; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--page-bg); color: var(--page-fg); font-family: var(--f-body); font-size: 14px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 32px; max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.topo-pagina { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.topo-pagina h1 { font-family: var(--f-display); font-size: 26px; line-height: 32px; margin: 0; text-wrap: balance; }
.topo-pagina p { margin: 4px 0 0; color: var(--page-muted); max-width: 640px; line-height: 20px; }
.palco { display: flex; gap: 24px; align-items: flex-start; justify-content: center; }
.aparelho { display: flex; flex-direction: column; gap: 8px; align-items: center; min-width: 0; }
.aparelho > .rot { font: 600 12px/16px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--page-muted); }
.troca { display: none; gap: 8px; }
.troca button { flex: 1; }
/* ---------- celular ---------- */
.fone { box-sizing: border-box; width: 375px; max-width: 100%; height: clamp(640px, calc(100vh - 150px), 780px); background: var(--g50); border-radius: 44px; border: 10px solid #0B1A1F; box-shadow: 0 12px 32px rgba(6,59,78,.18); position: relative; overflow: hidden; display: flex; flex-direction: column; color: var(--graphite); }
.fone * { box-sizing: border-box; }
.sb { height: 40px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 26px 0; font: 600 14px var(--f-body); background: var(--white); }
.sb.esc { background: var(--deep); color: #fff; }
.sb .ind { display: flex; gap: 5px; align-items: center; }
.sb .ind i { display: block; width: 3px; background: currentColor; border-radius: 1px; }
.sb .bat { width: 22px; height: 11px; border: 1px solid currentColor; border-radius: 3px; padding: 1px; opacity: .9; } .sb .bat b { display: block; height: 100%; width: 80%; background: currentColor; border-radius: 1px; }
.tela { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.rolagem { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
.rolagem.chat { justify-content: flex-start; }
.rolagem::-webkit-scrollbar { width: 0; }
.cab { flex: none; height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 8px; background: var(--white); border-bottom: 1px solid var(--g200); }
.cab.esc { background: var(--deep); color: #fff; border-bottom: 0; }
.cab .tt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.cab .tt b { font: 600 15px/20px var(--f-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cab .tt span { font: 400 12px/16px var(--f-body); color: var(--g700); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cab.esc .tt span { color: rgba(255,255,255,.8); }
.cab h3 { font: 600 19px/26px var(--f-display); margin: 0; flex: 1; }
.ib { width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; display: grid; place-items: center; color: inherit; cursor: pointer; flex: none; }
.ib:focus-visible, .bt:focus-visible, .chip:focus-visible, .op:focus-visible, .card-p:focus-visible { outline: 3px solid var(--teal7); outline-offset: 2px; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.s { width: 18px; height: 18px; } svg.i.xs { width: 15px; height: 15px; } svg.i.l { width: 34px; height: 34px; }
.av { width: 32px; height: 32px; flex: none; display: grid; place-items: center; }
.av.ia { border-radius: 8px; background: var(--aqua50); }
.av.md { border-radius: 50%; background: var(--teal7); color: #fff; font: 600 12px var(--f-body); }
.av.g { width: 44px; height: 44px; font-size: 15px; }
.sim { display: block; }
h2.t { font: 600 22px/30px var(--f-display); margin: 0; text-wrap: balance; }
h2.t.c { text-align: center; }
.sub { color: var(--g700); font-size: 14px; line-height: 20px; margin: 0; }
.c { text-align: center; }
.lg { font-size: 12px; line-height: 16px; color: var(--g700); }
/* botões */
.bt { min-height: 52px; width: 100%; border-radius: 999px; border: 0; padding: 0 22px; font: 600 16px var(--f-body); display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
.bt.pri { background: var(--green); color: var(--graphite); }
.bt.pri:active { background: var(--green7); color: #fff; }
.bt.sec { background: transparent; color: var(--teal7); box-shadow: inset 0 0 0 1.5px var(--teal7); }
.bt.txt { background: transparent; color: var(--teal7); min-height: 44px; }
.bt.peq { min-height: 40px; font-size: 14px; padding: 0 16px; width: auto; }
.bt.ver { background: var(--red); color: #fff; }
.bt:disabled { background: var(--g200); color: var(--g500); box-shadow: none; cursor: not-allowed; }
.duo { display: flex; gap: 10px; } .duo > * { flex: 1; }
.rodape { flex: none; padding: 10px 20px 14px; display: flex; flex-direction: column; gap: 10px; align-items: center; background: var(--g50); }
.link { color: var(--teal7); font-weight: 600; background: none; border: 0; padding: 4px; cursor: pointer; font: 600 14px var(--f-body); }
/* campos */
.cp { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.cp label { font: 500 14px/20px var(--f-body); }
.cp input, .cp textarea, .cp select { height: 50px; border-radius: 8px; border: 1px solid var(--g200); background: var(--white); padding: 0 14px; font: 400 16px var(--f-body); color: var(--graphite); width: 100%; }
.cp textarea { height: auto; min-height: 76px; padding: 10px 14px; line-height: 22px; resize: vertical; }
.cp input:focus, .cp textarea:focus { outline: none; border: 2px solid var(--teal); }
.cp input:disabled { background: var(--g200); color: var(--g500); }
.cp.erro input { border: 2px solid var(--red); }
.cp .aj { font-size: 12px; line-height: 16px; color: var(--g700); display: flex; gap: 6px; align-items: center; }
.cp.erro .aj { color: var(--red); }
.linha { display: flex; gap: 10px; } .linha > * { min-width: 0; }
.cod { display: flex; gap: 12px; }
.cod input { width: 60px; height: 64px; text-align: center; font: 600 24px var(--f-display); border-radius: 8px; border: 1px solid var(--g200); background: var(--white); color: var(--graphite); }
.cod input:focus { outline: none; border: 2px solid var(--teal); }
.pontos { display: flex; gap: 6px; } .pontos i { width: 8px; height: 8px; border-radius: 4px; background: var(--g200); } .pontos i.on { width: 20px; background: var(--teal7); }
.barra6 { display: flex; gap: 4px; } .barra6 i { flex: 1; height: 4px; border-radius: 2px; background: var(--g200); } .barra6 i.on { background: var(--teal7); }
/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.cen { justify-content: center; }
.chip { min-height: 44px; border-radius: 999px; border: 1px solid var(--g200); background: var(--white); color: var(--graphite); font: 600 13px var(--f-body); padding: 0 16px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.chip svg { color: var(--teal7); }
.chip.on { background: var(--teal7); color: #fff; border-color: var(--teal7); } .chip.on svg { color: #fff; }
.chip.f { flex: 1; justify-content: center; }
.chip.ex { border-style: dashed; color: var(--g700); font-weight: 500; }
/* balões */
.msg { display: flex; gap: 8px; align-items: flex-end; max-width: 100%; }
.msg .col { display: flex; flex-direction: column; gap: 4px; min-width: 0; max-width: 262px; }
.msg .ass { font-size: 11px; line-height: 14px; color: var(--g700); }
.bal { padding: 10px 14px; border-radius: 20px 20px 20px 4px; background: var(--aqua); font-size: 15px; line-height: 22px; white-space: pre-line; text-wrap: pretty; overflow-wrap: anywhere; }
.bal b { font-weight: 600; }
.msg.pac { justify-content: flex-end; }
.msg.pac .bal { background: var(--teal7); color: #fff; border-radius: 20px 20px 4px 20px; max-width: 262px; }
.msg.nota .bal { background: #FFF6D6; color: var(--graphite); border: 1px dashed #C9A227; }
.soc { width: 56px; height: 56px; border-radius: 28px; border: 1px solid var(--g200); background: var(--white); display: grid; place-items: center; cursor: pointer; }
.perfil { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.12); }
.perfil button { flex: 1; min-height: 40px; border: 0; border-radius: 999px; background: transparent; color: #fff; font: 600 14px var(--f-body); cursor: pointer; }
.perfil button.on { background: #fff; color: var(--deep); }
.faixa { display: flex; gap: 10px; align-items: center; width: 100%; border: 0; background: var(--deep); color: #fff; padding: 10px 20px; font: 500 13px var(--f-body); cursor: pointer; text-align: left; flex: none; }
.faixa span { flex: 1; } .faixa b { color: var(--green); }
.notif { position: absolute; left: 10px; right: 10px; top: 46px; z-index: 8; background: var(--white); border-radius: 16px; box-shadow: 0 12px 32px rgba(6,59,78,.22); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.semana { display: flex; gap: 6px; } .semana button { flex: 1; border: 1px solid var(--g200); background: var(--white); border-radius: 12px; padding: 8px 0; display: flex; flex-direction: column; align-items: center; font: 400 11px var(--f-body); color: var(--g700); cursor: pointer; position: relative; }
.semana button b { font: 600 17px var(--f-display); color: var(--graphite); } .semana button.on { background: var(--teal7); border-color: var(--teal7); color: #fff; } .semana button.on b { color: #fff; }
.semana button i { position: absolute; bottom: 4px; width: 5px; height: 5px; border-radius: 3px; background: var(--green); }
.rolagem > * { flex-shrink: 0; }
.pref { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--g200); } .pref:last-child { border-bottom: 0; }
.pref > div { flex: 1; display: flex; flex-direction: column; gap: 2px; } .pref b { font-weight: 600; font-size: 15px; } .pref span { font-size: 12px; line-height: 16px; color: var(--g700); }
.lg.rot { font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.cartao-l { display: flex; gap: 12px; align-items: center; } .cartao-l svg { flex: none; } .cartao-l .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; } .cartao-l .tx b { font-size: 15px; } .cartao-l .tx span { font-size: 13px; color: var(--g700); }
.cc-campo { position: relative; } .cc-campo input { padding-right: 62px; width: 100%; } .cc-campo span { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: flex; }
.faq-q { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; font: inherit; color: inherit; } .faq-q > b { flex: 1; font-size: 15px; } .faq-q > svg { transition: transform .2s; flex: none; } .faq-q[aria-expanded="true"] > svg { transform: rotate(90deg); }
.card p { margin: 0; font-size: 14px; line-height: 20px; color: var(--g700); }
.pol { display: flex; flex-direction: column; gap: 4px; } .pol h4 { font: 600 16px/22px var(--f-display); margin: 8px 0 2px; } .pol p, .pol li { font-size: 14px; line-height: 21px; color: var(--g700); margin: 0; } .pol ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.cp textarea { height: auto; min-height: 112px; padding: 12px 14px; resize: none; font: 400 15px/21px var(--f-body); }
.nova { margin-left: auto; display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--g200); background: var(--white); font: 600 13px var(--f-body); color: var(--teal7); cursor: pointer; flex: none; }
/* texto grande: cada texto cresce; nada de zoom (no Safari do iPhone o zoom empurrava a tela para fora) */
.fone.grande .bal { font-size: 17px; line-height: 25px; }
.fone.grande .lg, .fone.grande .ass, .fone.grande .sis, .fone.grande .pref span { font-size: 14px; line-height: 19px; }
.fone.grande .sub, .fone.grande .card p, .fone.grande .pol p, .fone.grande .pol li, .fone.grande .aviso, .fone.grande .av-l .tx span, .fone.grande .cartao-l .tx span, .fone.grande .kv div { font-size: 16px; line-height: 23px; }
.fone.grande .chip, .fone.grande .link, .fone.grande .bt.peq { font-size: 15px; }
.fone.grande .bt { font-size: 18px; }
.fone.grande .lista-m button, .fone.grande .cp input, .fone.grande .cp textarea, .fone.grande .comp input { font-size: 17px; }
.fone.grande .cp label { font-size: 16px; line-height: 22px; }
.fone.grande .pref b, .fone.grande .faq-q > b, .fone.grande .av-l .tx b, .fone.grande .cartao-l .tx b { font-size: 17px; }
.fone.grande .cab h3 { font-size: 21px; } .fone.grande .cab .tt b { font-size: 17px; } .fone.grande .cab .tt span { font-size: 13px; }
.fone.grande h2.t { font-size: 25px; line-height: 32px; }
.fone.grande .abas button { font-size: 12px; } .fone.grande .selo { font-size: 13px; height: 26px; }
.fone.grande .duo { flex-wrap: wrap; } .fone.grande .duo > * { flex: 1 1 auto; }
.chip.f { min-width: 0; }
:where(.fone) :where(button, input, textarea, select) { color: inherit; }
.fone.escuro { --white: #132A31; --g50: #0B1A1F; --g200: #25404A; --g700: #A9BCC0; --g500: #7E9397; --graphite: #E6EFF0; --aqua: #173E42; --aqua50: #14343A; --mint: #163D35; --teal7: #2FA69D; --green7: #4FD3AE; --coral50: #3A2622; --coral7: #FF9D82; --deep: #04212B; border-color: #000; }
.fone.escuro .bt.pri, .fone.escuro .comp .env { color: #0B1A1F; }
.fone.escuro .toast { background: #E6EFF0; color: #0B1A1F; }
.fone.escuro .msg.nota .bal { color: #0B1A1F; }
.fone.escuro input::placeholder, .fone.escuro textarea::placeholder { color: var(--g500); }
.regra { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--red); } .regra.ok { color: var(--green7); }
.sis { align-self: center; background: var(--g200); color: var(--g700); font-size: 12px; line-height: 16px; padding: 6px 12px; border-radius: 999px; text-align: center; max-width: 300px; }
.recuo { padding-left: 40px; display: flex; flex-direction: column; gap: 8px; }
.digit { display: flex; gap: 4px; padding: 14px 16px; background: var(--aqua); border-radius: 20px 20px 20px 4px; }
.digit i { width: 7px; height: 7px; border-radius: 4px; background: var(--g500); animation: pisca 1s infinite; } .digit i:nth-child(2) { animation-delay: .2s } .digit i:nth-child(3) { animation-delay: .4s }
@keyframes pisca { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .digit i { animation: none; opacity: .7 } }
/* cards */
.card { background: var(--white); border: 1px solid var(--g200); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.card.sel { background: var(--aqua50); border: 2px solid var(--teal7); }
.card.ting { background: var(--aqua50); border: 0; }
.card.lem { background: var(--coral50); border: 0; }
.card.suc { background: var(--mint); border: 0; }
.card.esc { background: var(--deep); border: 0; color: #fff; }
.kv { display: flex; flex-direction: column; }
.kv div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--g200); font-size: 14px; }
.kv div:last-child { border-bottom: 0; }
.kv span { color: var(--g700); } .kv b { font-weight: 600; text-align: right; }
.av-l { display: flex; gap: 12px; align-items: flex-start; }
.av-l .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.av-l .tx b { font-size: 14px; } .av-l .tx span { font-size: 13px; color: var(--g700); line-height: 18px; }
.selo { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font: 600 12px var(--f-body); white-space: nowrap; }
.selo.n { background: var(--g200); color: var(--g700); } .selo.i { background: var(--aqua50); color: var(--teal7); } .selo.s { background: var(--mint); color: var(--green7); } .selo.l { background: var(--coral50); color: var(--coral7); } .selo.e { background: var(--coral50); color: var(--red); }
.selos { display: flex; flex-wrap: wrap; gap: 6px; }
.op { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 12px; background: var(--white); border: 1px solid var(--g200); cursor: pointer; text-align: left; width: 100%; font: inherit; color: inherit; }
.op.on { background: var(--aqua50); border: 2px solid var(--teal7); }
.op .ic { width: 42px; height: 42px; border-radius: 12px; background: var(--aqua50); display: grid; place-items: center; color: var(--teal7); flex: none; }
.op.on .ic { background: var(--white); }
.op .tx { flex: 1; display: flex; flex-direction: column; } .op .tx b { font-size: 15px; } .op .tx span { font-size: 13px; color: var(--g700); }
.op .pr { font: 600 17px var(--f-display); color: var(--teal7); }
.aviso { display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--aqua50); font-size: 13px; line-height: 18px; color: var(--g700); }
.aviso svg { color: var(--teal7); } .aviso b { color: var(--graphite); display: block; font-size: 14px; }
.aviso.l { background: var(--coral50); } .aviso.l svg { color: var(--coral7); }
.aviso.e { background: var(--coral50); } .aviso.e svg { color: var(--red); }
.aviso.s { background: var(--mint); } .aviso.s svg { color: var(--green7); }
.icone-g { width: 72px; height: 72px; border-radius: 36px; display: grid; place-items: center; align-self: center; }
/* composer */
.comp { flex: none; background: var(--white); border-top: 1px solid var(--g200); padding: 8px 10px 8px; display: flex; flex-direction: column; gap: 6px; }
.comp .lin { display: flex; gap: 4px; align-items: center; }
.comp input { flex: 1; min-width: 0; height: 44px; border-radius: 22px; border: 0; background: var(--aqua50); padding: 0 16px; font: 400 15px var(--f-body); color: var(--graphite); }
.comp input:focus { outline: 2px solid var(--teal); }
.comp .env { width: 44px; height: 44px; border-radius: 22px; border: 0; display: grid; place-items: center; background: var(--green); color: var(--graphite); cursor: pointer; flex: none; }
.comp .disc { font-size: 11px; line-height: 14px; color: var(--g500); text-align: center; }
.comp .sug { display: flex; gap: 6px; overflow-x: auto; } .comp .sug .chip { min-height: 36px; white-space: nowrap; }
/* abas */
.abas { flex: none; display: flex; background: var(--white); border-top: 1px solid var(--g200); padding-bottom: 10px; }
.abas button { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 4px; font: 400 11px var(--f-body); color: var(--g500); cursor: pointer; position: relative; }
.abas button.on { color: var(--teal7); font-weight: 600; }

      if (v === 'receita') { pacDiz('Renovar receita'); p.tipo = 'Renovação de receitas'; await iniciarTriagem('Renovação de receitas'); return; }

      if (v === 'exame') { pacDiz('Analisar um exame'); p.fluxo = 'exame-pedido'; await iaDiz('Claro. Envie o PDF ou a foto do exame pelo clipe, aqui na conversa.', { anexar: true }); return; }
      break;
    case 'p-anexo':
      if (p.tela !== 'home' || p.aba !== 'inicio') return;
      p.chat.push({ de: 'pac', txt: 'Pode analisar meu exame de sangue?', arq: true }); p.atalhos = false; render(); rolar();
      await iaDiz('Organizei os marcadores do seu hemograma, Antônio. A maior parte está dentro da referência. Dois pontos merecem atenção:', { marcadores: true });
      p.fluxo = null; await iaDiz('Quem interpreta o resultado é o médico. Vale conversar com um sobre a vitamina D.', { cta: true }); return;
    case 'p-dor': { const d = document.getElementById('dor').value; p.chat[p.chat.length - 1].escala = false; pacDiz('Dor ' + d + ' de 10'); p.tipo = 'Clínico geral'; await iniciarTriagem('Clínico geral'); p.resp.dor = d + ' de 10'; return; }
    case 'p-op': await responder(v); return;
    case 'p-ex': await responder(v); return;
    case 'p-cta': case 'p-saude-medico': p.aba = 'inicio'; pacDiz('Quero falar com um médico'); await iniciarTriagem(); return;
    case 'p-escolher': p.tela = 'modalidade'; break;
    case 'p-mod': p.mod = v; break;
    case 'p-pag': p.pag = v; p.recusado = false; break;
    case 'p-pagar': {
      if (p.pag === 'cartao') p.cartao = document.getElementById('cc-n').value;
      p.processando = true; p.recusado = false; render();
      setTimeout(() => { p.processando = false; if (p.pag === 'cartao' && (p.cartao || '').replace(/\D/g, '') === '4000000000000002') { p.recusado = true; render(); return; } criarConsulta(); render(); }, 1300); return; }
    case 'p-continuar': S.c.opsPaciente = false; S.c.msgs.push({ de: 'pac', txt: 'Continuar agora' }, { de: 'sis', txt: pnome() + ' voltou à conversa' }); break;
    case 'p-pausar': S.c.opsPaciente = false; S.c.status = 'pausado'; S.c.msgs.push({ de: 'sis', txt: pnome() + ' pausou o atendimento · pode voltar até ' + S.c.ate }); p.tela = 'pausado'; toast('m', 'O ' + pnome() + ' pausou o atendimento. Ele pode voltar até ' + S.c.ate + '.'); break;
    case 'p-retomar': S.c.status = 'atendimento'; S.c.msgs.push({ de: 'sis', txt: pnome() + ' retomou o atendimento' }); p.tela = ehVideo() ? 'video' : 'consulta'; toast('m', 'O ' + pnome() + ' voltou ao atendimento.'); break;
    case 'p-reiniciar-chat': p.tela = 'home'; p.aba = 'inicio'; p.chat = []; p.atalhos = true; p.fluxo = null; p.livre = 0; S.c = null; break;
    case 'p-avaliar': p.tela = 'avaliacao'; break;
    case 'p-estrela': p.estrelas = +v; break;
    case 'p-tag': p.tags = p.tags.includes(v) ? p.tags.filter(t => t !== v) : [...p.tags, v]; break;
    case 'p-enviar-av': if (m.pacientes[0]) m.pacientes[0].nota = p.estrelas; p.tela = 'home'; p.aba = 'inicio'; p.chat = []; p.atalhos = true; p.fluxo = null; p.livre = 0; toast('p', 'Avaliação enviada. Obrigado.'); toast('m', 'O ' + pnome() + ' avaliou o atendimento: ' + p.estrelas + ' de 5.'); break;
    // médico
    case 'm-aba': m.aba = v; if (m.tela === 'agenda') m.tela = 'fila'; if (v === 'fila') m.tela = 'fila'; if (v === 'atendimento' && S.c && ['atendimento', 'pausado', 'inativo'].includes(S.c.status)) m.tela = 'atendimento'; if (v === 'atendimento' && S.c && S.c.status === 'finalizado') m.tela = 'finalizado'; break;
    case 'm-disp': m.disp = !m.disp; if (m.disp && S.c && S.c.status === 'fila') m.notif = true; break;
    case 'm-abrir': if (v === 'antonio' && !(S.c && S.c.status === 'fila')) return; m.abrir = v; m.tela = 'triagem'; break;
    case 'm-devolver': m.tela = 'fila'; m.abrir = null; break;
    case 'm-aceitar': m.notif = false; if (m.abrir !== 'antonio') { toast('m', 'João e Carla são exemplos da fila. Neste teste, quem conversa é o paciente do celular ao lado.'); return; } aceitar(); break;
    case 'm-nota': m.nota = v === '1'; break;
    case 'm-sug': enviarMedico(v); return;
    case 'm-receita': m.folha = true; break;
    case 'm-fechar-rx': m.folha = false; break;
    case 'm-enviar-rx': m.receita = document.getElementById('rx').value; m.folha = false; S.c.msgs.push({ de: 'doc', txt: 'Receita · ' + m.receita.split('·')[0].trim().replace(/[.,]$/, '') }); S.c.receitaEnviada = true; toast('m', 'Receita assinada e enviada ao paciente.'); break;
    case 'm-finalizar': abrirResumo(); break;
    case 'm-assinar': document.querySelectorAll('[data-rs]').forEach(t => m.resumo[t.dataset.rs] = t.value); finalizar(); break;
    // tempo
    case 't-30': S.c.msgs.push({ de: 'sis', txt: 'Paciente sem responder há 30 minutos' }, { de: 'ia', txt: 'Oi, ' + pnome() + '. Você está sem responder há 30 minutos. O ' + MEDICO.nome + ' continua aqui, aguardando você. Quer retomar o atendimento?' }); if (ehVideo()) { S.p.tela = 'consulta'; } break;
    case 't-60': S.c.msgs.push({ de: 'sis', txt: 'Sem resposta há 1 hora' }, { de: 'ia', txt: pnome() + ', o ' + MEDICO.nome + ' continua disponível. Você quer seguir com o atendimento agora ou prefere pausar e voltar mais tarde?' }); S.c.opsPaciente = true; S.p.tela = 'consulta'; break;
    case 't-180': S.c.status = 'inativo'; S.c.msgs.push({ de: 'sis', txt: 'Atendimento encerrado por inatividade: 3 horas sem retorno' }); S.p.tela = 'inativo'; clearInterval(S.t); break;
    case 't-reset': clearInterval(S.t); S = novo(); break;
  }
  render(); rolar();
}
function trocarAparelho(ver) { const pal = document.getElementById('palco'); pal.dataset.ver = ver; document.querySelectorAll('[data-tr]').forEach(x => x.classList.toggle('on', x.dataset.tr === ver)); if (window.innerWidth > 820) document.getElementById(ver === 'medico' ? 'ap-m' : 'ap-p').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
function enviarMedico(txt) { if (!txt || !S.c) return; if (S.m.nota) S.c.notas.push({ de: 'nota', txt }); else S.c.msgs.push({ de: 'med', txt }); render(); rolar(); if (!S.m.nota) { const resp = ['Está bem, sem enjoo. Estou me alimentando melhor.', 'Entendi, doutor. Obrigado!', 'Pode deixar.']; const i = S.c.msgs.filter(x => x.de === 'med').length - 2; setTimeout(() => { if (S.c && S.c.status === 'atendimento') { S.c.msgs.push({ de: 'pac', txt: resp[Math.max(0, i) % resp.length] }); render(); rolar(); } }, 1600); } }
document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b) { e.preventDefault(); acao(b.dataset.a, b.dataset.v, b); return; } const t = e.target.closest('[data-tr]'); if (t) { document.getElementById('palco').dataset.ver = t.dataset.tr; document.querySelectorAll('[data-tr]').forEach(x => x.classList.toggle('on', x === t)); } });
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-f]'); if (!f) return; e.preventDefault();
  const inp = f.querySelector('input'); const txt = inp.value.trim(); if (!txt) return; inp.value = '';
  if (f.dataset.f === 'm') { enviarMedico(txt); return; }
  if (f.dataset.f === 'sup') { S.p.supMsgs.push({ de: 'eu', txt }); render(); rolar(); setTimeout(() => { S.p.supMsgs.push({ de: 'sup', txt: S.p.supMsgs.filter(m => m.de === 'sup').length ? 'Combinado. Fico de olho e te aviso por aqui.' : 'Entendi. Vou verificar agora e te respondo aqui mesmo em poucos minutos.' }); if (S.p.sub === 'supchat') { render(); rolar(); } }, 1300); return; }
  if (S.p.tela === 'consulta') { S.c.msgs.push({ de: 'pac', txt }); S.c.opsPaciente = false; render(); rolar(); return; }
  await responder(txt);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'dor') { S.p.dor = +t.value; const o = document.getElementById('dor-v'); if (o) o.textContent = t.value + ' de 10'; }
  if (t.dataset.cod != null) { t.value = t.value.replace(/\D/g, '').slice(0, 1); const all = [...document.querySelectorAll('[data-cod]')]; if (t.value && all[+t.dataset.cod + 1]) all[+t.dataset.cod + 1].focus(); document.getElementById('bt-cad').disabled = !all.every(x => x.value); }
  if (t.id === 'r-n1' || t.id === 'r-n2') {
    const a = document.getElementById('r-n1').value, b = document.getElementById('r-n2').value;
    const ok = { r8: a.length >= 8, resp: /[^A-Za-z0-9]/.test(a), rmai: /[A-Z]/.test(a), rnum: /\d/.test(a), rig: !!a && a === b };
    for (const [k, v] of Object.entries(ok)) { const el = document.getElementById(k); el.classList.toggle('ok', v); el.querySelector('svg').innerHTML = v ? IP.ok : IP.erro; }
    document.getElementById('bt-sen').disabled = !Object.values(ok).every(Boolean);
  }
  if (t.id === 'cc-novo') { const d = t.value.replace(/\D/g, '').slice(0, 19); t.value = d.replace(/(.{4})/g, '$1 ').trim(); document.getElementById('cc-band').innerHTML = BAND[bandeira(d)][1]; }
  if (t.id === 'cc-val') { const d = t.value.replace(/\D/g, '').slice(0, 4); t.value = d.length > 2 ? d.slice(0, 2) + '/' + d.slice(2) : d; }
  if (t.id === 'cc-cvv') t.value = t.value.replace(/\D/g, '').slice(0, 4);
  if (t.id === 'sup-busca') { S.p.busca = t.value; S.p.faq = null; render(); }
  if (t.id === 'c-cep') { const d = t.value.replace(/\D/g, ''); S.p.cep = t.value; if (d.length === 8 && !S.p.cepOk) { S.p.cepOk = true; render(); const c = document.getElementById('c-num'); if (c) c.focus(); } }
});
render();
</script>
